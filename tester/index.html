<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controller Tester</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a; --text: #e6e8ee; --muted: #8a92a3;
    --idle: #262b36; --active: #4cc2ff; --accent: #ffb547;
    --a: #3ddc84; --b: #ff5c5c; --x: #4c9bff; --y: #ffd04c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif; }
  header { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  #status { color: var(--muted); }
  main { padding: 20px; display: grid; gap: 20px; }
  .pad { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; grid-template-columns: minmax(0, 3fr) minmax(260px, 2fr); gap: 20px; }
  @media (max-width: 900px) { .pad { grid-template-columns: 1fr; } }
  .pad h2 { grid-column: 1 / -1; font-size: 14px; margin: 0; font-weight: 600; word-break: break-word; }
  .pad h2 small { color: var(--muted); font-weight: 400; margin-left: 8px; }
  svg { width: 100%; height: auto; }
  svg .btn { fill: var(--idle); stroke: var(--line); stroke-width: 2; transition: fill 40ms; }
  svg .body { fill: #1f232c; stroke: var(--line); stroke-width: 2; }
  svg text { fill: var(--muted); font-size: 13px; font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  svg .well { fill: #14171d; stroke: var(--line); stroke-width: 2; }
  svg .stick { fill: #3a4150; stroke: #596174; stroke-width: 2; }
  svg .stick.pressed { fill: var(--active); }
  svg .trail { fill: none; stroke: var(--accent); stroke-width: 1.5; opacity: .6; }
  svg .tfill { fill: var(--accent); }
  .raw h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-bottom: 16px; }
  .cell { background: var(--idle); border-radius: 6px; padding: 6px 4px; text-align: center; font-variant-numeric: tabular-nums; position: relative; overflow: hidden; }
  .cell .lvl { position: absolute; left: 0; bottom: 0; height: 100%; background: var(--active); opacity: .35; }
  .cell.on { outline: 2px solid var(--active); }
  .cell b { display: block; font-size: 11px; color: var(--muted); position: relative; }
  .cell span { position: relative; font-size: 12px; }
  .axis { display: grid; grid-template-columns: 56px 1fr 56px; gap: 8px; align-items: center; margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .axis .bar { height: 10px; background: var(--idle); border-radius: 5px; position: relative; }
  .axis .bar i { position: absolute; top: 0; bottom: 0; background: var(--active); border-radius: 5px; }
  .axis .bar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--muted); }
  .axis span:last-child { text-align: right; }
  .controls { margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap; }
  button.ui { background: var(--idle); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  button.ui:hover { border-color: var(--active); }
  .empty { color: var(--muted); padding: 40px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
</style>
</head>
<body>
<header>
  <h1>Gamepad Visualizer</h1>
  <span id="status">Waiting for a controller. Press any button on it.</span>
  <a href="../" style="margin-left:auto;color:var(--active)">← Back to hub</a>
</header>
<main id="pads">
  <div class="empty" id="empty">No controller detected yet. Browsers only expose a gamepad after you press one of its buttons while this page is focused.</div>
</main>

<template id="pad-tpl">
  <section class="pad">
    <h2><span class="name"></span><small class="meta"></small></h2>
    <div>
      <svg viewBox="0 0 640 400" aria-label="Controller layout">
        <!-- triggers -->
        <rect class="well" x="110" y="8" width="90" height="34" rx="8"/>
        <rect class="tfill" data-trig="6" x="110" y="8" width="0" height="34" rx="8"/>
        <text x="155" y="25">LT</text>
        <rect class="well" x="440" y="8" width="90" height="34" rx="8"/>
        <rect class="tfill" data-trig="7" x="440" y="8" width="0" height="34" rx="8"/>
        <text x="485" y="25">RT</text>
        <!-- bumpers -->
        <rect class="btn" data-btn="4" x="100" y="50" width="110" height="26" rx="10"/><text x="155" y="63">LB</text>
        <rect class="btn" data-btn="5" x="430" y="50" width="110" height="26" rx="10"/><text x="485" y="63">RB</text>
        <!-- body -->
        <path class="body" d="M140 86 H500 C590 86 630 170 630 260 C630 350 580 392 540 392 C500 392 470 330 430 310 H210 C170 330 140 392 100 392 C60 392 10 350 10 260 C10 170 50 86 140 86 Z"/>
        <!-- left stick -->
        <circle class="well" cx="155" cy="170" r="52"/>
        <path class="trail" data-trail="0"/>
        <circle class="stick" data-stick="0" cx="155" cy="170" r="24"/>
        <!-- d-pad -->
        <rect class="btn" data-btn="12" x="225" y="232" width="34" height="38" rx="5"/>
        <rect class="btn" data-btn="13" x="225" y="306" width="34" height="38" rx="5"/>
        <rect class="btn" data-btn="14" x="187" y="270" width="38" height="36" rx="5"/>
        <rect class="btn" data-btn="15" x="259" y="270" width="38" height="36" rx="5"/>
        <rect x="225" y="270" width="34" height="36" fill="#262b36"/>
        <text x="242" y="251">▲</text><text x="242" y="325">▼</text><text x="206" y="288">◀</text><text x="278" y="288">▶</text>
        <!-- center -->
        <rect class="btn" data-btn="8" x="252" y="150" width="40" height="22" rx="11"/><text x="272" y="186" style="font-size:11px">Back</text>
        <rect class="btn" data-btn="9" x="348" y="150" width="40" height="22" rx="11"/><text x="368" y="186" style="font-size:11px">Start</text>
        <circle class="btn" data-btn="16" cx="320" cy="120" r="18"/><text x="320" y="120">⌂</text>
        <!-- right stick -->
        <circle class="well" cx="400" cy="290" r="52"/>
        <path class="trail" data-trail="1"/>
        <circle class="stick" data-stick="1" cx="400" cy="290" r="24"/>
        <!-- face buttons -->
        <circle class="btn" data-btn="3" data-color="--y" cx="485" cy="130" r="22"/><text x="485" y="130">Y</text>
        <circle class="btn" data-btn="2" data-color="--x" cx="440" cy="175" r="22"/><text x="440" y="175">X</text>
        <circle class="btn" data-btn="1" data-color="--b" cx="530" cy="175" r="22"/><text x="530" y="175">B</text>
        <circle class="btn" data-btn="0" data-color="--a" cx="485" cy="220" r="22"/><text x="485" y="220">A</text>
      </svg>
      <div class="controls">
        <button class="ui" data-act="rumble">Test vibration</button>
        <button class="ui" data-act="stop">Stop vibration</button>
        <button class="ui" data-act="clear">Clear stick trails</button>
      </div>
    </div>
    <div class="raw">
      <h3>Buttons</h3>
      <div class="grid buttons"></div>
      <h3>Axes</h3>
      <div class="axes"></div>
    </div>
  </section>
</template>

<script src="../shared/pad.js"></script>
<script>
// Labels for the W3C "standard" mapping; other controllers fall back to indices.
const STD_NAMES = ["A","B","X","Y","LB","RB","LT","RT","Back","Start","LS","RS","Up","Down","Left","Right","Home"];
const AXIS_NAMES = ["LX","LY","RX","RY"];
const TRAIL_LEN = 60;
const views = new Map();
let noteUntil = 0;

const $status = document.getElementById("status");
const $pads = document.getElementById("pads");
const $empty = document.getElementById("empty");

function testVibration() {
  const p = Pad.poll();
  const act = p.gp && p.gp.vibrationActuator;
  if (act && act.playEffect) Pad.rumble(1, 1, 600);
  else { $status.textContent = "This controller or browser does not support vibration."; noteUntil = performance.now() + 3000; }
}
function clearTrails() {
  views.forEach(v => v.sticks.forEach(s => { s.pts = []; s.trail.setAttribute("d", ""); }));
}

// Start and Back must stay testable here, so the menu opens on a long hold.
Pad.setup({
  title: "Controller Tester",
  hubUrl: "../",
  holdToOpen: true,
  items: [
    { label: "Test vibration", action: testVibration, keepOpen: true },
    { label: "Stop vibration", action: Pad.stopRumble, keepOpen: true },
    { label: "Clear stick trails", action: clearTrails },
  ],
});

function createView(gp) {
  // Clear any vibration left running by a previous page.
  Pad.stopRumble();
  const node = document.getElementById("pad-tpl").content.firstElementChild.cloneNode(true);
  const std = gp.mapping === "standard";
  node.querySelector(".name").textContent = `#${gp.index} ${gp.id}`;
  node.querySelector(".meta").textContent =
    `${std ? "standard mapping" : "non-standard mapping (layout may not match)"} · ${gp.buttons.length} buttons · ${gp.axes.length} axes`;

  const btnGrid = node.querySelector(".buttons");
  const cells = gp.buttons.map((_, i) => {
    const c = document.createElement("div");
    c.className = "cell";
    c.innerHTML = `<div class="lvl" style="width:0"></div><b>${std && STD_NAMES[i] ? STD_NAMES[i] : "B" + i}</b><span>0.00</span>`;
    btnGrid.appendChild(c);
    return { el: c, lvl: c.querySelector(".lvl"), val: c.querySelector("span") };
  });

  const axesBox = node.querySelector(".axes");
  const axes = gp.axes.map((_, i) => {
    const row = document.createElement("div");
    row.className = "axis";
    row.innerHTML = `<span>${std && AXIS_NAMES[i] ? AXIS_NAMES[i] : "Axis " + i}</span><div class="bar"><i></i></div><span>0.000</span>`;
    axesBox.appendChild(row);
    return { bar: row.querySelector("i"), val: row.querySelector("span:last-child") };
  });

  const view = {
    node, cells, axes,
    svgBtns: [...node.querySelectorAll("[data-btn]")],
    trig: [...node.querySelectorAll("[data-trig]")],
    sticks: [...node.querySelectorAll("[data-stick]")].map(s => ({
      el: s, cx: +s.getAttribute("cx"), cy: +s.getAttribute("cy"),
      trail: node.querySelector(`[data-trail="${s.dataset.stick}"]`), pts: []
    })),
  };

  node.querySelector('[data-act="rumble"]').onclick = testVibration;
  node.querySelector('[data-act="stop"]').onclick = Pad.stopRumble;
  node.querySelector('[data-act="clear"]').onclick = clearTrails;

  $pads.appendChild(node);
  return view;
}

function update(view, gp) {
  gp.buttons.forEach((b, i) => {
    const c = view.cells[i];
    if (!c) return;
    c.el.classList.toggle("on", b.pressed);
    c.lvl.style.width = (b.value * 100) + "%";
    c.val.textContent = b.value.toFixed(2);
  });

  gp.axes.forEach((v, i) => {
    const a = view.axes[i];
    if (!a) return;
    const left = Math.min(50, 50 + v * 50), width = Math.abs(v) * 50;
    a.bar.style.left = left + "%";
    a.bar.style.width = width + "%";
    a.val.textContent = v.toFixed(3);
  });

  if (gp.mapping !== "standard") return;

  view.svgBtns.forEach(el => {
    const b = gp.buttons[+el.dataset.btn];
    const color = el.dataset.color ? `var(${el.dataset.color})` : "var(--active)";
    el.style.fill = b && b.pressed ? color : "";
  });

  view.trig.forEach(el => {
    const b = gp.buttons[+el.dataset.trig];
    el.setAttribute("width", b ? 90 * b.value : 0);
  });

  view.sticks.forEach((s, i) => {
    const x = gp.axes[i * 2] || 0, y = gp.axes[i * 2 + 1] || 0;
    const px = s.cx + x * 28, py = s.cy + y * 28;
    s.el.setAttribute("cx", px);
    s.el.setAttribute("cy", py);
    const pressed = gp.buttons[10 + i];
    s.el.classList.toggle("pressed", !!(pressed && pressed.pressed));
    s.pts.push(`${px.toFixed(1)},${py.toFixed(1)}`);
    if (s.pts.length > TRAIL_LEN) s.pts.shift();
    s.trail.setAttribute("d", "M" + s.pts.join(" L"));
  });
}

function loop() {
  Pad.poll();
  const pads = [...navigator.getGamepads()].filter(Boolean);
  const seen = new Set();
  for (const gp of pads) {
    seen.add(gp.index);
    let view = views.get(gp.index);
    if (!view) { view = createView(gp); views.set(gp.index, view); }
    update(view, gp);
  }
  for (const [idx, view] of views) {
    if (!seen.has(idx)) { view.node.remove(); views.delete(idx); }
  }
  $empty.style.display = pads.length ? "none" : "";
  if (performance.now() > noteUntil) {
    $status.textContent = pads.length
      ? `${pads.length} controller${pads.length > 1 ? "s" : ""} connected · hold Start or Back for the menu`
      : "Waiting for a controller. Press any button on it.";
  }
  requestAnimationFrame(loop);
}

if (!navigator.getGamepads) {
  $empty.textContent = "This browser does not support the Gamepad API.";
} else {
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
